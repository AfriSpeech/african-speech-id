<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>African Speech ID</title>
<style>
  :root {
    --bg: #0f1115; --card: #171a21; --line: #262b36; --text: #e8eaed;
    --dim: #9aa3b2; --accent: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f6f7f9; --card:#fff; --line:#e3e6ec; --text:#1a1d23;
            --dim:#5f6673; --accent:#16a34a; }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--text);
    font: 16px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 28px 20px 48px;
  }
  .wrap { width: 100%; max-width: 720px; margin: 0 auto; }
  h1 { font-size: 1.5rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--dim); font-size: .92rem; margin: 0 0 20px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 14px;
          padding: 20px; }

  /* ---- samples: the primary way in, so it gets the space and the top of the page ---- */
  #search {
    width: 100%; padding: 14px 16px; font-size: 1rem; font-family: inherit;
    color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 10px; margin-bottom: 14px;
  }
  #search:focus { outline: none; border-color: var(--accent); }
  .chips { display: flex; flex-wrap: wrap; gap: 7px; max-height: 260px; overflow-y: auto;
           padding: 2px; }
  .chips button {
    padding: 8px 13px; font-size: .87rem; font-family: inherit; cursor: pointer;
    color: var(--text); background: var(--bg); border: 1px solid var(--line);
    border-radius: 99px; transition: border-color .12s, background .12s;
  }
  .chips button:hover { border-color: var(--accent); }
  .chips button[data-on="1"] { border-color: var(--accent); background: var(--accent);
                               color: #06210f; font-weight: 600; }
  .chips button:disabled { opacity: .45; cursor: default; }
  .count { color: var(--dim); font-size: .8rem; margin: 10px 0 0; }

  audio.played { width: 100%; margin-top: 14px; height: 34px; }
  audio.played[hidden] { display: none; }

  /* ---- result ---- */
  #out { display: none; margin-top: 16px; padding-top: 16px;
         border-top: 1px solid var(--line); }
  .lang { font-size: 1.5rem; font-weight: 650; letter-spacing: -0.01em; }
  .conf { color: var(--dim); font-size: .84rem; margin-top: 3px; }
  .verdict { margin-top: 10px; font-size: .9rem; }
  .verdict.good { color: var(--accent); }
  .verdict.bad { color: var(--warn); }
  .bars { margin-top: 14px; display: grid; gap: 6px; }
  .bar { display: grid; grid-template-columns: 1fr 110px 44px; align-items: center;
         gap: 10px; font-size: .84rem; }
  .bar .t { height: 6px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar .t i { display: block; height: 100%; background: var(--accent); }
  .bar .n { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  .tx { margin-top: 14px; padding: 10px 12px; border-radius: 8px; background: var(--bg);
        border: 1px solid var(--line); font-size: .84rem; color: var(--dim);
        word-break: break-word; }
  .tx b { color: var(--text); font-weight: 500; }
  .hint { margin-top: 12px; font-size: .86rem; color: var(--dim); }
  .hint.warn { color: var(--warn); }
  .hint.bad { color: var(--bad); }

  /* ---- your own audio: secondary, compact, one row ---- */
  .own { margin-top: 18px; display: flex; gap: 10px; align-items: stretch; }
  .own > * { flex: 1; }
  .own label, .own button {
    display: flex; align-items: center; justify-content: center; gap: 8px;
    padding: 12px; font-size: .9rem; font-family: inherit; cursor: pointer;
    color: var(--text); background: var(--card); border: 1px solid var(--line);
    border-radius: 10px;
  }
  .own label:hover, .own button:hover { border-color: var(--accent); }
  .own button[data-state="recording"] { border-color: var(--bad); color: var(--bad); }
  #file { display: none; }
  .ownhint { margin-top: 8px; font-size: .8rem; color: var(--dim); }
  footer { margin-top: 22px; font-size: .78rem; color: var(--dim); text-align: center; }
  footer a { color: var(--dim); }
</style>
</head>
<body>
<div class="wrap">
  <h1>African Speech ID</h1>
  <p class="sub">Click on a language below to fetch sample audio to test the model.
     The samples were not seen in training.</p>

  <div class="card">
    <input id="search" type="search" autocomplete="off" placeholder="Search 68 languages…">
    <div class="chips" id="chips"></div>
    <p class="count" id="count"></p>

    <audio id="clip" class="played" controls hidden></audio>

    <div id="out">
      <div class="lang" id="lang"></div>
      <div class="conf" id="conf"></div>
      <div class="verdict" id="verdict"></div>
      <div class="bars" id="bars"></div>
      <div class="tx" id="tx"></div>
    </div>

    <div class="hint" id="hint"></div>
  </div>

  <div class="own">
    <label for="file">Upload audio or video</label>
    <button id="rec">Record</button>
  </div>
  <input id="file" type="file" accept="audio/*,video/*">
  <div class="ownhint" id="ownhint">Five seconds minimum, ten or more works best.</div>

  <footer>
    <a href="https://github.com/AfriSpeech/african-speech-id">code</a> ·
    <a href="https://huggingface.co/AfriSpeech/african-speech-id">model</a> ·
    runs on CPU<br>
    samples from <a href="https://huggingface.co/datasets/google/WaxalNLP">Waxal</a> and the
    <a href="https://huggingface.co/datasets/facebook/omnilingual-asr-corpus">Omnilingual ASR
    corpus</a>, CC BY 4.0
  </footer>
</div>

<script>
const WARM = "https://ghana-nlp-2--african-speech-id-identifier-warm.modal.run";
const IDENTIFY = "https://ghana-nlp-2--african-speech-id-identifier-identify.modal.run";
const IDENTIFY_FILE = "https://ghana-nlp-2--african-speech-id-identifier-identify-file.modal.run";

const MIN_SEC = 5.0, MAX_SEC = 20.0, SR = 16000;
const el = id => document.getElementById(id);
let SAMPLES = [], NAMES = {}, warmed = false, busy = false;

function warm() { if (!warmed) { warmed = true; fetch(WARM, {mode:"cors"}).catch(()=>{}); } }
function pretty(code) {
  const n = NAMES[code];
  return n && n !== code ? n : code;
}
function setHint(t, cls="") { el("hint").className = "hint " + cls; el("hint").textContent = t; }

// ------------------------------------------------------------------ results
function show(d, expectIso, expectName) {
  if (!d || !d.ok) {
    const why = (d && d.reason) || "something went wrong";
    let msg;
    if (why === "not enough speech") {
      msg = "Only " + (d.speech_seconds||0).toFixed(1) + "s of that was speech. Pauses and "
          + "silence do not help.";
    } else if (why === "too short") {
      msg = "Too short — give it at least " + MIN_SEC + " seconds.";
    } else if (why === "no speech recognised") {
      msg = "No speech recognised. Try louder or closer audio.";
    } else if (why === "too quiet") {
      msg = "Too quiet. Move closer to the microphone.";
    } else if (why === "could not read that file") {
      msg = "Could not read that file — it may have no audio track.";
    } else { msg = "Could not identify: " + why; }
    setHint(msg, "warn");
    el("out").style.display = "none";
    return;
  }
  const got = String(d.language);
  el("lang").textContent = pretty(got) + (pretty(got) !== got ? "  (" + got + ")" : "");
  el("conf").textContent = d.seconds + "s audio, " + (d.speech_seconds ?? "?") + "s speech, "
    + d.chars + " characters recognised";
  const v = el("verdict");
  if (expectIso) {
    const right = got === expectIso;
    v.className = "verdict " + (right ? "good" : "bad");
    v.textContent = right ? "Correct — this clip is " + expectName + "."
                          : "This clip is " + expectName + " (" + expectIso + ").";
  } else { v.textContent = ""; v.className = "verdict"; }
  el("bars").innerHTML = (d.top || []).map(t =>
    '<div class="bar"><span>' + pretty(String(t.language)) + '</span>'
    + '<span class="t"><i style="width:' + Math.min(100, Math.round(t.score*100*8)) + '%"></i></span>'
    + '<span class="n">' + (t.score*100).toFixed(1) + '%</span></div>').join("");
  el("tx").innerHTML = "<b>Heard:</b> " + (d.transcript || "");
  el("out").style.display = "block";
}

async function post(blob, expectIso, expectName, label) {
  if (busy) return;
  busy = true; warm();
  document.querySelectorAll(".chips button").forEach(b => b.disabled = true);
  setHint("Listening to " + label + "…");
  try {
    const r = await fetch(IDENTIFY_FILE, { method:"POST", mode:"cors",
      headers:{"Content-Type":"application/octet-stream"}, body: blob });
    const d = await r.json();
    show(d, expectIso, expectName);
    if (d && d.ok) setHint("Pick another language, or try your own audio below.");
  } catch (e) { setHint("Could not reach the service. Try again in a moment.", "bad"); }
  document.querySelectorAll(".chips button").forEach(b => b.disabled = false);
  busy = false;
}

// ------------------------------------------------------------------ samples
async function playSample(entry, chip) {
  document.querySelectorAll(".chips button").forEach(b => b.dataset.on = "0");
  chip.dataset.on = "1";
  el("out").style.display = "none";
  const blob = await (await fetch("samples/" + entry.file)).blob();
  const c = el("clip"); c.src = URL.createObjectURL(blob); c.hidden = false;
  c.play().catch(()=>{});
  post(blob, entry.iso, entry.name, entry.name);
}

function render(filter) {
  const q = (filter || "").trim().toLowerCase();
  const list = SAMPLES.filter(s => !q || s.name.toLowerCase().includes(q)
                                     || s.iso.toLowerCase().includes(q));
  const box = el("chips"); box.innerHTML = "";
  list.forEach(entry => {
    const b = document.createElement("button");
    b.textContent = entry.name;
    b.title = entry.iso;
    b.onclick = () => playSample(entry, b);
    box.appendChild(b);
  });
  el("count").textContent = list.length + " of " + SAMPLES.length + " languages"
    + (q ? " match “" + filter + "”" : " — held-out test audio, never seen in training");
}

fetch("samples/manifest.json").then(r => r.json()).then(list => {
  SAMPLES = list; render("");
}).catch(() => setHint("Samples unavailable.", "bad"));
fetch("label_names.json").then(r => r.json()).then(n => { NAMES = n; }).catch(()=>{});
el("search").oninput = e => render(e.target.value);
el("search").onfocus = warm;

// ------------------------------------------------------------------ your own audio
el("file").onchange = e => {
  const f = e.target.files[0];
  if (!f) return;
  if (f.size > 80*1024*1024) { setHint("That file is over 80 MB.", "warn"); return; }
  el("clip").hidden = true;
  post(f, null, null, f.name);
  e.target.value = "";
};

let ctx, stream, node, chunks = [], recording = false, t0 = 0;
function encodeWav(samples, rate) {
  const b = new ArrayBuffer(44 + samples.length*2), v = new DataView(b);
  const w = (o,s) => { for (let i=0;i<s.length;i++) v.setUint8(o+i, s.charCodeAt(i)); };
  w(0,"RIFF"); v.setUint32(4, 36+samples.length*2, true); w(8,"WAVEfmt ");
  v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,rate,true); v.setUint32(28,rate*2,true); v.setUint16(32,2,true);
  v.setUint16(34,16,true); w(36,"data"); v.setUint32(40, samples.length*2, true);
  let o = 44;
  for (const s of samples) { const x = Math.max(-1, Math.min(1, s));
    v.setInt16(o, x < 0 ? x*0x8000 : x*0x7fff, true); o += 2; }
  return new Blob([b], {type:"audio/wav"});
}
async function startRec() {
  warm();
  try { stream = await navigator.mediaDevices.getUserMedia({audio:{channelCount:1,
        sampleRate:SR, echoCancellation:true, noiseSuppression:true}}); }
  catch (e) { setHint("Microphone permission denied.", "bad"); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)({sampleRate:SR});
  const src = ctx.createMediaStreamSource(stream);
  node = ctx.createScriptProcessor(4096, 1, 1);
  chunks = []; recording = true; t0 = performance.now();
  node.onaudioprocess = e => { if (recording) chunks.push(new Float32Array(e.inputBuffer.getChannelData(0))); };
  src.connect(node); node.connect(ctx.destination);
  el("rec").textContent = "Stop"; el("rec").dataset.state = "recording";
  setHint("Recording — speak for ten seconds if you can.");
  setTimeout(() => { if (recording) stopRec(); }, MAX_SEC*1000);
}
async function stopRec() {
  recording = false;
  el("rec").textContent = "Record"; el("rec").dataset.state = "";
  try { node.disconnect(); stream.getTracks().forEach(t => t.stop()); await ctx.close(); } catch(e){}
  const secs = (performance.now() - t0)/1000;
  if (secs < MIN_SEC) { setHint("Only " + secs.toFixed(1) + "s. At least " + MIN_SEC
      + "s is needed.", "warn"); return; }
  let n = 0; chunks.forEach(c => n += c.length);
  const all = new Float32Array(n); let off = 0;
  chunks.forEach(c => { all.set(c, off); off += c.length; });
  const blob = encodeWav(all, SR);
  el("clip").src = URL.createObjectURL(blob); el("clip").hidden = false;
  post(blob, null, null, "your recording");
}
el("rec").onclick = () => recording ? stopRec() : startRec();
(async () => {
  if (!navigator.mediaDevices) { el("rec").disabled = true; el("rec").textContent = "Recording unsupported"; }
})();
</script>
</body>
</html>
